name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Auditoría semanal aunque nadie toque el código.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Auditoría de seguridad
        run: npm audit --audit-level=high
