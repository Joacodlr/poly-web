version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Un solo PR con las actualizaciones menores y de parche.
      menores:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /poly-studio
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      menores:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
